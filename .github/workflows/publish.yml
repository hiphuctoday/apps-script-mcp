name: Publish to PyPI

# Runs when a GitHub release is published. Uses PyPI trusted publishing,
# so no API token is stored in this repository.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Check that the release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(uv version --short)"
          if [ "${TAG#v}" != "$version" ]; then
            echo "Release tag $TAG does not match pyproject.toml version $version" >&2
            exit 1
          fi

      - name: Run tests
        run: uv run pytest

      - name: Build
        run: uv build

      - name: Publish
        run: uv publish
