[project]
name = "apps-script-mcp"
version = "0.1.0"
description = "MCP server for Google Apps Script that needs no Google Cloud Console setup"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.3",
    "httpx>=0.27",
]

[project.urls]
Repository = "https://github.com/hiphuctoday/apps-script-mcp"
Issues = "https://github.com/hiphuctoday/apps-script-mcp/issues"

[project.scripts]
apps-script-mcp = "apps_script_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apps_script_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
